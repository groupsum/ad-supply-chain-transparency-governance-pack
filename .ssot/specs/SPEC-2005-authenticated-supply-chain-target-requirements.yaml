body: |-
  ## Requirements
  
  Authenticated supply-chain targets must cover ads.cert signature or authenticated inventory evidence, OpenRTB request-time chain fields, validation failure handling, retained proof artifacts, and reconciliation between declared files and transmitted chain evidence.
  
  The repository must keep authenticated evidence targets implementation-neutral and must not require one exchange, SSP, DSP, verification vendor, or cryptographic storage system.
  
  ## Evidence
  
  Downstream templates must identify expected source snapshots, parsed records, request-time chain objects, signature validation outputs, reconciliation reports, and audit evidence artifacts.
