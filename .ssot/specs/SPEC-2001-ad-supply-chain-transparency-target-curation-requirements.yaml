body: |-
  ## Requirements
  
  This repository must curate advertising supply-chain transparency targets only when they define authorized seller declarations, seller identity, request-time supply paths, buyer identity, demand paths, authenticated inventory evidence, or OpenRTB supply-chain carriage.
  
  Each curated target must record authority owner, source title, source type, governed transparency capability, and version or publication date when available.
  
  The curated target set must include ads.txt, app-ads.txt, sellers.json, SupplyChain Object, buyers.json, DemandChain Object, ads.cert, and OpenRTB supply-chain fields.
  
  ## Exclusions
  
  The curation surface excludes generic ad measurement quality, campaign attribution, customer identity, consent transport, and non-ad partner transparency unless used only as contextual input for an advertising supply-chain transparency target.
