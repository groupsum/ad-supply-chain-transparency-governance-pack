body: |-
  ## Requirements
  
  Buyer and demand-path targets must be curated as distinct but reconcilable authority surfaces. buyers.json targets must cover file structure, buyer identifiers, buyer metadata, confidentiality treatment, and buyer-account relationships. DemandChain Object targets must cover node ordering, completeness, identifiers, participant semantics, and request-time normalization.
  
  ## Evidence
  
  The repository must map buyer and demand-path targets to downstream templates that require parsed buyer records, parsed demand-chain nodes, and buyer path reconciliation outputs.
