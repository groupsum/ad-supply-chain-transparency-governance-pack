body: |-
  ## Context
  
  Authorized seller declarations are foundational to transparent digital ad inventory sales for web and app inventory.
  
  ## Decision
  
  ads.txt and app-ads.txt are selected as canonical authority sources for seller authorization targets. The repository must curate them separately because web inventory and app inventory have different discovery and ownership paths.
