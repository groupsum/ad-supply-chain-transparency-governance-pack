body: |-
  ## Context
  
  Supply-chain transparency may require transmitted request-time chain evidence and authenticated inventory evidence in addition to declared seller and buyer files.
  
  ## Decision
  
  ads.cert and OpenRTB supply-chain fields are selected as canonical authority sources for authenticated/transmitted supply-chain evidence targets. ads.cert governs signed inventory or authenticated signal treatment. OpenRTB governs request-time carriage of supply-chain information.
