body: |-
  ## Context
  
  Buy-side transparency requires authority sources that describe buying entities and request-time demand paths.
  
  ## Decision
  
  buyers.json and the DemandChain Object are selected as canonical authority sources for buyer identity and demand-path transparency targets. The repository must curate buyer identity files separately from request-time demand-chain node requirements.
