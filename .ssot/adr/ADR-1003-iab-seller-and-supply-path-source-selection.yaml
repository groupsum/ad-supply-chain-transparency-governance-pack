body: |-
  ## Context
  
  Sell-side transparency depends on both declared seller identity files and request-time supply path objects.
  
  ## Decision
  
  sellers.json and the SupplyChain Object are selected as canonical authority sources for seller identity and supply-path transparency targets. The repository must curate file-level seller identity requirements separately from request-time supply-chain node requirements.
