  "scope": {
    "governs": "Downstream reconciliation among declared seller and buyer files, request-time chain objects, authenticated evidence, and transparency reports.",
    "excludes": [
      "Ad measurement quality scoring",
      "Customer identity matching",
      "Campaign attribution logic"
    ]
