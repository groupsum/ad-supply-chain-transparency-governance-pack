  "decision": [
    "Define reconciliation keys and failure handling before publishing supply-chain transparency reports or claims.",
    "Reconcile declared authorized sellers, seller identities, request-time supply paths, buyer identities, demand paths, and authenticated evidence where applicable.",
    "Retain source snapshots, parsed records, request-time objects, validation reports, and reconciliation outputs as evidence."
  ],
  "conformance_targets": [
    "seller authorization reconciliation",
    "buyer demand-path reconciliation",
    "transparency audit evidence"
  ],
  "evidence_expectations": [
    "source snapshots",
    "parsed transparency records",
    "chain validation and reconciliation reports"
  ]
}
